<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Property - KIBIRA MODERN SITES</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <div class="logo">
            KIBIRA MODERN SITES
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#properties">
                Properties
            </a>

        </nav>

    </header>


    <section class="search-section">

        <h2>Add New Property</h2>

        <p>
            Enter the details of the property below.
        </p>

        <form id="propertyForm"
              style="max-width:600px;
                     margin:30px auto;
                     text-align:left;">

            <label>
                Property Name
            </label>

            <input
                type="text"
                id="propertyName"
                placeholder="Example: Residential Plot"
                required
                style="width:100%;
                       padding:14px;
                       margin:8px 0 20px;"
            >


            <label>
                Location
            </label>

            <input
                type="text"
                id="propertyLocation"
                placeholder="Example: Wakiso"
                required
                style="width:100%;
                       padding:14px;
                       margin:8px 0 20px;"
            >


            <label>
                Property Type
            </label>

            <select
                id="propertyType"
                required
                style="width:100%;
                       padding:14px;
                       margin:8px 0 20px;">

                <option value="">
                    Select property type
                </option>

                <option value="Land">
                    Land
                </option>

                <option value="House">
                    House
                </option>

                <option value="Commercial">
                    Commercial
                </option>

            </select>


            <label>
                Price (UGX)
            </label>

            <input
                type="number"
                id="propertyPrice"
                placeholder="Example: 10000000"
                required
                style="width:100%;
                       padding:14px;
                       margin:8px 0 20px;"
            >


            <label>
                Plot Size / Property Size
            </label>

            <input
                type="text"
                id="propertySize"
                placeholder="Example: 50 × 100 ft"
                required
                style="width:100%;
                       padding:14px;
                       margin:8px 0 20px;"
            >


            <label>
                Description
            </label>

            <textarea
                id="propertyDescription"
                placeholder="Describe the property..."
                required
                style="width:100%;
                       height:120px;
                       padding:14px;
                       margin:8px 0 20px;">
            </textarea>


            <button type="submit">
                Submit Property
            </button>

        </form>

    </section>


    <footer>

        <p>
            © 2026 KIBIRA MODERN SITES.
            All Rights Reserved.
        </p>

    </footer>


    <script>

        document
            .getElementById("propertyForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert(
                    "Property submitted successfully!"
                );

                document
                    .getElementById("propertyForm")
                    .reset();

            });

    </script>

</body>

</html>
