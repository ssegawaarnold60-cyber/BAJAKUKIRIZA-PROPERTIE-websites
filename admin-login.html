<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | KIBIRA MODERN SITES</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            KIBIRA MODERN SITES
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#properties">
                Properties
            </a>

        </nav>

    </header>



    <!-- LOGIN SECTION -->

    <section class="search-section">

        <div style="
            max-width:450px;
            margin:50px auto;
            background:white;
            padding:35px;
            border-radius:10px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        ">

            <h2>
                Admin Login
            </h2>

            <p style="margin:15px 0 30px;">
                Login to manage KIBIRA MODERN SITES.
            </p>


            <form id="adminLoginForm">


                <!-- EMAIL -->

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                    style="
                        width:100%;
                        padding:14px;
                        margin:8px 0 20px;
                    "
                >



                <!-- PASSWORD -->

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                    style="
                        width:100%;
                        padding:14px;
                        margin:8px 0 20px;
                    "
                >


                <button
                    type="submit"
                    style="width:100%;"
                >
                    Login
                </button>


            </form>


            <p
                id="loginMessage"
                style="
                    margin-top:20px;
                    font-weight:bold;
                "
            ></p>


        </div>

    </section>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 KIBIRA MODERN SITES.
            All Rights Reserved.
        </p>

    </footer>



    <!-- LOGIN JAVASCRIPT -->

    <script>

        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("adminEmail")
                        .value;


                const password =
                    document
                        .getElementById("adminPassword")
                        .value;


                /*
                    TEMPORARY LOGIN

                    We will replace this with
                    a real database authentication
                    system later.
                */

                if (
                    email === "admin@kibira.com" &&
                    password === "Admin123"
                ) {

                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    window.location.href =
                        "admin-dashboard.html";

                }

                else {

                    document
                        .getElementById("loginMessage")
                        .textContent =
                        "Incorrect email or password.";

                }

            });

    </script>


</body>

</html>
